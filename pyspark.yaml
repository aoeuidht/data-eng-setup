- name: init pyenv
  hosts: pyspark
  remote_user: root
  become: true
  vars:
    ansible_remote_tmp: /tmp
    users:
    - { name: "Haochuan_Zhou", key: "ssh-rsa  hz@Keyser.local" }
    - { name: "Meihui_Wu", key: "ssh-rsa  wumeihui@es-macbook-pro.lan.uow.edu.au" }
    - { name: "Yushu_Zhu", key: "ssh-rsa  yushu@yushudeMacBook-Pro.local" }
    - { name: "Yifei_Wang", key: "ssh-rsa  yw394@uowmail.edu.au" }
    - { name: "Yaoyao_Wang", key: "ssh-rsa  cngongxingjiang@gmail.com" }
    - { name: "Shaojun_He", key: "ssh-rsa  shaojun@shaojuns-air.lan.uow.edu.au" }    
  tasks:
  - name: install packages
    ansible.builtin.apt:
      name: "{{ item }}"
      state: present
    with_items:
      - virtualenv

  - name: Install pyspark
    ansible.builtin.pip:
      name: "{{ item }}"
    with_items:
      - jupyterlab
      - notebook
      - pyspark

  - name: create user and group
    ansible.builtin.user:
      name: "{{ item.name }}"
      group: "work"
      shell: /bin/bash
    with_items: "{{ users }}"

  - name: keys
    authorized_key:
      user: "{{ item.name }}"
      state: present
      manage_dir: yes
      key: "{{ item.key }}"
    with_items: "{{ users }}"

  - name: config bashrc
    become: yes
    become_user: "{{ item.name }}"
    lineinfile:
      dest: "~/.bashrc"
      line: |
        export TERM=xterm
        export HADOOP_HOME=/opt/hadoop-3.3.6
        export HIVE_HOME=/opt/apache-hive-3.1.3-bin/
        export SPARK_HOME=/opt/spark-3.5.1-bin-hadoop3/
        export HDFS_NAMENODE_OPTS="-XX:+UseParallelGC -Xmx2g"
        export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64/jre/
        export HADOOP_CONF_DIR=/opt/hadoop-3.3.6/etc/hadoop/
        export PATH=$PATH:$JAVA_HOME/bin:$HADOOP_HOME/bin:$SPARK_HOME/bin:$HIVE_HOME/bin
    with_items: "{{ users }}"

